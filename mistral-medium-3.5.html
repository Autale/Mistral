<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chat vs Papillon vs Laser</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            overflow: hidden;
            background: linear-gradient(135deg, #87CEEB 0%, #E0F7FF 100%);
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: Arial, sans-serif;
            cursor: default;
        }

        body.laser-mode {
            cursor: url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" width="32" height="32" viewBox="0 0 32 32"><rect width="32" height="32" fill="none"/><path d="M2 16 L30 16" stroke="%23ff0000" stroke-width="3" stroke-linecap="round"/><path d="M28 14 L30 16 L28 18" stroke="%23ff0000" stroke-width="2" fill="none"/><circle cx="30" cy="16" r="4" fill="%23ff0000" opacity="0.3"/></svg>'), auto;
        }

        canvas {
            display: block;
        }

        #info {
            position: absolute;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(0, 0, 0, 0.7);
            color: white;
            padding: 10px 20px;
            border-radius: 20px;
            font-size: 14px;
            text-align: center;
        }

        #info span {
            color: #ff6b6b;
        }
    </style>
</head>
<body>
    <canvas id="game"></canvas>
    <div id="info">Cliquez pour activer le <span>LASER</span> !</div>

    <script>
        // ==================== CONFIGURATION ====================
        const CANVAS_WIDTH = 800;
        const CANVAS_HEIGHT = 600;
        const CAT_SIZE = 60;
        const BUTTERFLY_SIZE = 30;
        const LASER_RADIUS = 8;

        // ==================== CANVAS SETUP ====================
        const canvas = document.getElementById('game');
        const ctx = canvas.getContext('2d');
        canvas.width = CANVAS_WIDTH;
        canvas.height = CANVAS_HEIGHT;

        // ==================== STATE ====================
        let isLaserActive = false;
        let mouseX = CANVAS_WIDTH / 2;
        let mouseY = CANVAS_HEIGHT / 2;
        let isMouseMoving = false;

        // ==================== CHAT ====================
        const cat = {
            x: CANVAS_WIDTH / 2,
            y: CANVAS_HEIGHT / 2,
            size: CAT_SIZE,
            speed: 3,
            direction: 0,
            targetX: CANVAS_WIDTH / 2,
            targetY: CANVAS_HEIGHT / 2,
            attention: 'butterfly', // 'butterfly' ou 'laser'
            cooldown: 0,
            
            update: function(butterfly, laserX, laserY) {
                // Détermine la cible en fonction de l'attention
                if (isLaserActive && this.cooldown <= 0) {
                    this.attention = 'laser';
                    this.targetX = laserX;
                    this.targetY = laserY;
                } else if (this.cooldown <= 0) {
                    this.attention = 'butterfly';
                    this.targetX = butterfly.x;
                    this.targetY = butterfly.y;
                }

                // Réduit le cooldown
                if (this.cooldown > 0) {
                    this.cooldown--;
                }

                // Calcule la direction vers la cible
                const dx = this.targetX - this.x;
                const dy = this.targetY - this.y;
                const distance = Math.sqrt(dx * dx + dy * dy);

                if (distance > 5) {
                    this.direction = Math.atan2(dy, dx);
                    
                    // Déplacement avec accélération/décélération
                    const moveSpeed = Math.min(this.speed, distance * 0.1);
                    this.x += Math.cos(this.direction) * moveSpeed;
                    this.y += Math.sin(this.direction) * moveSpeed;
                }

                // Limite les bords
                this.x = Math.max(this.size/2, Math.min(CANVAS_WIDTH - this.size/2, this.x));
                this.y = Math.max(this.size/2, Math.min(CANVAS_HEIGHT - this.size/2, this.y));
            },

            draw: function() {
                ctx.save();
                ctx.translate(this.x, this.y);
                ctx.rotate(this.direction);

                // Corps du chat
                ctx.fillStyle = '#ff9e80';
                ctx.beginPath();
                ctx.ellipse(0, 0, this.size * 0.4, this.size * 0.3, 0, 0, Math.PI * 2);
                ctx.fill();

                // Tête
                ctx.fillStyle = '#ffcc80';
                ctx.beginPath();
                ctx.ellipse(this.size * 0.35, 0, this.size * 0.35, this.size * 0.3, 0, 0, Math.PI * 2);
                ctx.fill();

                // Oreilles
                ctx.fillStyle = '#ffab40';
                ctx.beginPath();
                ctx.moveTo(this.size * 0.6, -this.size * 0.25);
                ctx.lineTo(this.size * 0.75, -this.size * 0.45);
                ctx.lineTo(this.size * 0.55, -this.size * 0.4);
                ctx.closePath();
                ctx.fill();

                ctx.beginPath();
                ctx.moveTo(this.size * 0.6, this.size * 0.25);
                ctx.lineTo(this.size * 0.75, this.size * 0.45);
                ctx.lineTo(this.size * 0.55, this.size * 0.4);
                ctx.closePath();
                ctx.fill();

                // Yeux
                ctx.fillStyle = '#000';
                ctx.beginPath();
                ctx.ellipse(this.size * 0.45, -this.size * 0.08, this.size * 0.08, this.size * 0.1, 0, 0, Math.PI * 2);
                ctx.fill();
                ctx.beginPath();
                ctx.ellipse(this.size * 0.45, this.size * 0.08, this.size * 0.08, this.size * 0.1, 0, 0, Math.PI * 2);
                ctx.fill();

                // Pupilles (regardent la cible)
                ctx.fillStyle = '#fff';
                const pupilOffsetX = Math.cos(this.direction) * this.size * 0.04;
                const pupilOffsetY = Math.sin(this.direction) * this.size * 0.04;
                ctx.beginPath();
                ctx.ellipse(this.size * 0.45 + pupilOffsetX, -this.size * 0.08 + pupilOffsetY, this.size * 0.03, this.size * 0.04, 0, 0, Math.PI * 2);
                ctx.fill();
                ctx.beginPath();
                ctx.ellipse(this.size * 0.45 + pupilOffsetX, this.size * 0.08 + pupilOffsetY, this.size * 0.03, this.size * 0.04, 0, 0, Math.PI * 2);
                ctx.fill();

                // Nez
                ctx.fillStyle = '#ff5722';
                ctx.beginPath();
                ctx.ellipse(this.size * 0.6, 0, this.size * 0.05, this.size * 0.06, 0, 0, Math.PI * 2);
                ctx.fill();

                // Moustaches
                ctx.strokeStyle = '#000';
                ctx.lineWidth = 2;
                ctx.beginPath();
                ctx.moveTo(this.size * 0.6, -this.size * 0.05);
                ctx.lineTo(this.size * 0.85, -this.size * 0.1);
                ctx.stroke();
                ctx.beginPath();
                ctx.moveTo(this.size * 0.6, 0);
                ctx.lineTo(this.size * 0.85, 0);
                ctx.stroke();
                ctx.beginPath();
                ctx.moveTo(this.size * 0.6, this.size * 0.05);
                ctx.lineTo(this.size * 0.85, this.size * 0.1);
                ctx.stroke();

                // Queue
                ctx.strokeStyle = '#ff9e80';
                ctx.lineWidth = this.size * 0.1;
                ctx.lineCap = 'round';
                ctx.beginPath();
                ctx.moveTo(-this.size * 0.35, 0);
                ctx.quadraticCurveTo(
                    -this.size * 0.5, -this.size * 0.3 * Math.sin(Date.now() * 0.005),
                    -this.size * 0.35, -this.size * 0.2
                );
                ctx.stroke();

                // Pattes
                ctx.strokeStyle = '#ff9e80';
                ctx.lineWidth = this.size * 0.08;
                ctx.lineCap = 'round';
                
                // Pattes avant
                ctx.beginPath();
                ctx.moveTo(this.size * 0.1, -this.size * 0.25);
                ctx.lineTo(this.size * 0.1, -this.size * 0.4);
                ctx.stroke();
                ctx.beginPath();
                ctx.moveTo(this.size * 0.1, this.size * 0.25);
                ctx.lineTo(this.size * 0.1, this.size * 0.4);
                ctx.stroke();

                // Pattes arrière
                ctx.beginPath();
                ctx.moveTo(-this.size * 0.2, -this.size * 0.25);
                ctx.lineTo(-this.size * 0.2, -this.size * 0.4);
                ctx.stroke();
                ctx.beginPath();
                ctx.moveTo(-this.size * 0.2, this.size * 0.25);
                ctx.lineTo(-this.size * 0.2, this.size * 0.4);
                ctx.stroke();

                ctx.restore();

                // Indicateur d'attention
                if (this.attention === 'laser') {
                    ctx.fillStyle = 'rgba(255, 0, 0, 0.3)';
                    ctx.beginPath();
                    ctx.arc(this.x, this.y, this.size * 0.6, 0, Math.PI * 2);
                    ctx.fill();
                } else {
                    ctx.fillStyle = 'rgba(255, 193, 7, 0.2)';
                    ctx.beginPath();
                    ctx.arc(this.x, this.y, this.size * 0.6, 0, Math.PI * 2);
                    ctx.fill();
                }
            }
        };

        // ==================== PAPILLON ====================
        const butterfly = {
            x: CANVAS_WIDTH / 4,
            y: CANVAS_HEIGHT / 3,
            size: BUTTERFLY_SIZE,
            speed: 2,
            direction: Math.random() * Math.PI * 2,
            flutterSpeed: 0.1,
            flutterOffset: 0,
            targetX: CANVAS_WIDTH / 4,
            targetY: CANVAS_HEIGHT / 3,
            state: 'flying', // 'flying', 'teasing'
            teaseTimer: 0,
            
            update: function(catX, catY) {
                // Comportement en fonction de l'état du chat
                const distanceToCat = Math.sqrt(
                    Math.pow(catX - this.x, 2) + Math.pow(catY - this.y, 2)
                );

                // Si le chat suit le laser, le papillon vient tournoyer autour du chat
                if (cat.attention === 'laser') {
                    this.state = 'teasing';
                    this.teaseTimer = 100;
                }

                // Si le papillon est en mode "taquin"
                if (this.state === 'teasing') {
                    if (this.teaseTimer > 0) {
                        this.teaseTimer--;
                        
                        // Tourne autour du chat
                        const angle = Date.now() * 0.002;
                        const radius = 80 + Math.sin(Date.now() * 0.001) * 20;
                        this.targetX = catX + Math.cos(angle) * radius;
                        this.targetY = catY + Math.sin(angle) * radius * 0.8;
                    } else {
                        this.state = 'flying';
                        // Nouvel objectif aléatoire
                        this.targetX = Math.random() * (CANVAS_WIDTH - this.size * 2) + this.size;
                        this.targetY = Math.random() * (CANVAS_HEIGHT - this.size * 2) + this.size;
                    }
                } else {
                    // Mode vol normal
                    if (distanceToCat < 100) {
                        // Le papillon fuit si le chat est trop près
                        const awayX = this.x - catX;
                        const awayY = this.y - catY;
                        const awayDistance = Math.sqrt(awayX * awayX + awayY * awayY);
                        this.targetX = this.x + (awayX / awayDistance) * 100;
                        this.targetY = this.y + (awayY / awayDistance) * 100;
                    } else if (distanceToCat < 200) {
                        // Le papillon change de direction
                        if (Math.random() < 0.01) {
                            this.targetX = Math.random() * (CANVAS_WIDTH - this.size * 2) + this.size;
                            this.targetY = Math.random() * (CANVAS_HEIGHT - this.size * 2) + this.size;
                        }
                    } else {
                        // Mouvement aléatoire
                        if (Math.random() < 0.005) {
                            this.targetX = Math.random() * (CANVAS_WIDTH - this.size * 2) + this.size;
                            this.targetY = Math.random() * (CANVAS_HEIGHT - this.size * 2) + this.size;
                        }
                    }
                }

                // Mouvement vers la cible avec effet de flutter
                const dx = this.targetX - this.x;
                const dy = this.targetY - this.y;
                const distance = Math.sqrt(dx * dx + dy * dy);

                if (distance > 5) {
                    this.direction = Math.atan2(dy, dx);
                    this.flutterOffset += this.flutterSpeed;
                    
                    const moveSpeed = Math.min(this.speed + Math.sin(this.flutterOffset) * 0.5, distance * 0.05);
                    this.x += Math.cos(this.direction) * moveSpeed;
                    this.y += Math.sin(this.direction) * moveSpeed;
                }

                // Limite les bords
                this.x = Math.max(this.size/2, Math.min(CANVAS_WIDTH - this.size/2, this.x));
                this.y = Math.max(this.size/2, Math.min(CANVAS_HEIGHT - this.size/2, this.y));
            },

            draw: function() {
                ctx.save();
                ctx.translate(this.x, this.y);
                ctx.rotate(this.direction + Math.sin(this.flutterOffset * 2) * 0.3);

                // Corps
                ctx.fillStyle = '#ffeb3b';
                ctx.beginPath();
                ctx.ellipse(0, 0, this.size * 0.3, this.size * 0.15, 0, 0, Math.PI * 2);
                ctx.fill();

                // Ailes supérieures
                ctx.fillStyle = 'rgba(255, 193, 7, 0.8)';
                ctx.beginPath();
                ctx.moveTo(0, 0);
                ctx.bezierCurveTo(
                    this.size * 0.3, -this.size * 0.3,
                    this.size * 0.6, -this.size * 0.2,
                    this.size * 0.4, -this.size * 0.1
                );
                ctx.bezierCurveTo(
                    this.size * 0.5, 0,
                    this.size * 0.4, this.size * 0.1,
                    0, 0
                );
                ctx.fill();

                ctx.fillStyle = 'rgba(255, 152, 0, 0.8)';
                ctx.beginPath();
                ctx.moveTo(0, 0);
                ctx.bezierCurveTo(
                    -this.size * 0.3, -this.size * 0.3,
                    -this.size * 0.6, -this.size * 0.2,
                    -this.size * 0.4, -this.size * 0.1
                );
                ctx.bezierCurveTo(
                    -this.size * 0.5, 0,
                    -this.size * 0.4, this.size * 0.1,
                    0, 0
                );
                ctx.fill();

                // Ailes inférieures
                ctx.fillStyle = 'rgba(255, 214, 10, 0.8)';
                ctx.beginPath();
                ctx.moveTo(0, 0);
                ctx.bezierCurveTo(
                    this.size * 0.4, this.size * 0.2,
                    this.size * 0.7, this.size * 0.4,
                    this.size * 0.3, this.size * 0.3
                );
                ctx.bezierCurveTo(
                    this.size * 0.2, 0,
                    this.size * 0.3, -this.size * 0.2,
                    0, 0
                );
                ctx.fill();

                ctx.fillStyle = 'rgba(255, 179, 0, 0.8)';
                ctx.beginPath();
                ctx.moveTo(0, 0);
                ctx.bezierCurveTo(
                    -this.size * 0.4, this.size * 0.2,
                    -this.size * 0.7, this.size * 0.4,
                    -this.size * 0.3, this.size * 0.3
                );
                ctx.bezierCurveTo(
                    -this.size * 0.2, 0,
                    -this.size * 0.3, -this.size * 0.2,
                    0, 0
                );
                ctx.fill();

                // Antennes
                ctx.strokeStyle = '#000';
                ctx.lineWidth = 1;
                ctx.beginPath();
                ctx.moveTo(this.size * 0.15, -this.size * 0.05);
                ctx.lineTo(this.size * 0.3, -this.size * 0.2);
                ctx.stroke();
                ctx.beginPath();
                ctx.moveTo(-this.size * 0.15, -this.size * 0.05);
                ctx.lineTo(-this.size * 0.3, -this.size * 0.2);
                ctx.stroke();

                // Points sur les antennes
                ctx.fillStyle = '#000';
                ctx.beginPath();
                ctx.arc(this.size * 0.3, -this.size * 0.2, this.size * 0.03, 0, Math.PI * 2);
                ctx.fill();
                ctx.beginPath();
                ctx.arc(-this.size * 0.3, -this.size * 0.2, this.size * 0.03, 0, Math.PI * 2);
                ctx.fill();

                ctx.restore();

                // Effet de traînées pour le papillon
                if (Math.random() < 0.3) {
                    ctx.fillStyle = 'rgba(255, 255, 255, 0.4)';
                    ctx.beginPath();
                    ctx.arc(
                        this.x + Math.cos(this.direction) * this.size * 0.2,
                        this.y + Math.sin(this.direction) * this.size * 0.2,
                        this.size * 0.05,
                        0, Math.PI * 2
                    );
                    ctx.fill();
                }
            }
        };

        // ==================== LASER ====================
        function drawLaser(x, y) {
            if (!isLaserActive) return;

            // Effet de laser depuis la souris
            ctx.strokeStyle = 'rgba(255, 0, 0, 0.8)';
            ctx.lineWidth = 4;
            ctx.lineCap = 'round';
            
            // Ligne du laser
            ctx.beginPath();
            ctx.moveTo(mouseX, mouseY);
            ctx.lineTo(x, y);
            ctx.stroke();

            // Point d'impact
            ctx.fillStyle = 'rgba(255, 0, 0, 0.5)';
            ctx.beginPath();
            ctx.arc(x, y, LASER_RADIUS, 0, Math.PI * 2);
            ctx.fill();

            // Effet de brillance
            ctx.fillStyle = 'rgba(255, 255, 255, 0.8)';
            ctx.beginPath();
            ctx.arc(x, y, LASER_RADIUS * 0.5, 0, Math.PI * 2);
            ctx.fill();

            // Animation de pulsation
            const pulseRadius = LASER_RADIUS * (1 + Math.sin(Date.now() * 0.01) * 0.3);
            ctx.strokeStyle = 'rgba(255, 0, 0, 0.3)';
            ctx.lineWidth = 2;
            ctx.beginPath();
            ctx.arc(x, y, pulseRadius, 0, Math.PI * 2);
            ctx.stroke();
        }

        // ==================== EFFETS VISUELS ====================
        const particles = [];

        function addParticle(x, y, color, size, velocityX, velocityY, life) {
            particles.push({
                x: x,
                y: y,
                color: color,
                size: size,
                velocityX: velocityX,
                velocityY: velocityY,
                life: life,
                maxLife: life
            });
        }

        function updateParticles() {
            for (let i = particles.length - 1; i >= 0; i--) {
                const p = particles[i];
                p.x += p.velocityX;
                p.y += p.velocityY;
                p.life--;

                if (p.life <= 0) {
                    particles.splice(i, 1);
                }
            }
        }

        function drawParticles() {
            for (const p of particles) {
                const alpha = p.life / p.maxLife;
                ctx.fillStyle = p.color.replace(')', `, ${alpha})`).replace('rgb', 'rgba');
                ctx.beginPath();
                ctx.arc(p.x, p.y, p.size * alpha, 0, Math.PI * 2);
                ctx.fill();
            }
        }

        // ==================== CLIC DE SOURIS ====================
        canvas.addEventListener('mousemove', (e) => {
            const rect = canvas.getBoundingClientRect();
            mouseX = e.clientX - rect.left;
            mouseY = e.clientY - rect.top;
            isMouseMoving = true;
        });

        canvas.addEventListener('click', (e) => {
            isLaserActive = !isLaserActive;
            document.body.classList.toggle('laser-mode', isLaserActive);
            
            const rect = canvas.getBoundingClientRect();
            const clickX = e.clientX - rect.left;
            const clickY = e.clientY - rect.top;

            // Effet de particule au clic
            for (let i = 0; i < 10; i++) {
                const angle = Math.random() * Math.PI * 2;
                const speed = Math.random() * 3 + 1;
                addParticle(
                    clickX, clickY,
                    'rgba(255, 0, 0, 1)',
                    Math.random() * 3 + 1,
                    Math.cos(angle) * speed,
                    Math.sin(angle) * speed,
                    30
                );
            }

            // Le chat a un cooldown après le changement
            cat.cooldown = 30;
        });

        // ==================== BOUCLE D'ANIMATION ====================
        function animate() {
            // Nettoyage
            ctx.clearRect(0, 0, CANVAS_WIDTH, CANVAS_HEIGHT);

            // Fond avec dégradé subtil
            const gradient = ctx.createLinearGradient(0, 0, CANVAS_WIDTH, CANVAS_HEIGHT);
            gradient.addColorStop(0, '#87CEEB');
            gradient.addColorStop(1, '#E0F7FF');
            ctx.fillStyle = gradient;
            ctx.fillRect(0, 0, CANVAS_WIDTH, CANVAS_HEIGHT);

            // Dessine le sol (herbe)
            ctx.fillStyle = '#7cb342';
            ctx.fillRect(0, CANVAS_HEIGHT - 40, CANVAS_WIDTH, 40);

            // Mise à jour
            butterfly.update(cat.x, cat.y);
            cat.update(butterfly, mouseX, mouseY);
            updateParticles();

            // Dessin
            butterfly.draw();
            
            if (isLaserActive) {
                drawLaser(mouseX, mouseY);
            }
            
            cat.draw();
            drawParticles();

            // Texte d'instruction
            ctx.fillStyle = 'rgba(0, 0, 0, 0.5)';
            ctx.font = '16px Arial';
            ctx.textAlign = 'center';
            
            if (isLaserActive) {
                ctx.fillText('Le chat suit votre laser ! Le papillon est jaloux...', CANVAS_WIDTH / 2, 30);
            } else {
                ctx.fillText('Le chat essaie d\'attraper le papillon... Cliquez pour le distraire !', CANVAS_WIDTH / 2, 30);
            }

            requestAnimationFrame(animate);
        }

        // ==================== DÉMARRAGE ====================
        animate();

        // Ajout de quelques particules initiales
        for (let i = 0; i < 20; i++) {
            addParticle(
                Math.random() * CANVAS_WIDTH,
                Math.random() * CANVAS_HEIGHT * 0.3,
                'rgba(255, 255, 255, 0.8)',
                Math.random() * 2 + 1,
                (Math.random() - 0.5) * 0.5,
                (Math.random() - 0.5) * 0.5,
                100 + Math.random() * 100
            );
        }
    </script>
</body>
</html>
